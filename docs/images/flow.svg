<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="t">How a HomeBox print reaches a Niimbot printer</title>
  <desc id="d">HomeBox runs a print command that posts to a NiimBridge webhook in Home Assistant. NiimBridge draws the label, picks the printer by label size, and calls niimbot.print in hass-niimbot, which prints over Bluetooth to a D110-M or B1.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="250" rx="14" fill="#f8fafc"/>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 125H242"/><path d="M458 125H492"/>
  </g>
  <g stroke-width="2">
    <rect x="30" y="80" width="170" height="90" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="242" y="60" width="216" height="130" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="492" y="80" width="176" height="90" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <rect x="702" y="30" width="168" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
    <rect x="702" y="140" width="168" height="80" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M668 125H686V70H700"/><path d="M686 125V180H700"/></g>
  <g fill="#0f172a" text-anchor="middle">
    <text x="115" y="118" font-size="17" font-weight="700">HomeBox</text>
    <text x="115" y="140" font-size="13">label template +</text>
    <text x="115" y="158" font-size="13">print command</text>
    <text x="350" y="92" font-size="17" font-weight="700">NiimBridge</text>
    <text x="350" y="116" font-size="13">webhook in Home Assistant</text>
    <text x="350" y="138" font-size="13">looks up asset ID + location</text>
    <text x="350" y="158" font-size="13">draws the label</text>
    <text x="350" y="178" font-size="13">routes by label size</text>
    <text x="580" y="118" font-size="17" font-weight="700">hass-niimbot</text>
    <text x="580" y="140" font-size="13">niimbot.print</text>
    <text x="580" y="158" font-size="13">(Bluetooth)</text>
    <text x="786" y="66" font-size="16" font-weight="700">D110-M</text>
    <text x="786" y="88" font-size="13">40 x 12 mm</text>
    <text x="786" y="176" font-size="16" font-weight="700">B1</text>
    <text x="786" y="198" font-size="13">50 x 30 mm</text>
    <text x="221" y="116" font-size="11" fill="#475569">POST</text>
  </g>
</svg>
